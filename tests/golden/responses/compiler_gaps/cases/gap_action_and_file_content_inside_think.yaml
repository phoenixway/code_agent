description: "Compiler emits AMBIGUOUS instead of a more specific error for action and file_content inside think."
input: |
  <think>
  <action>{"type":"write_file_block","path":"x.txt","overwrite":true}</action>
  <file_content>
  bad
  </file_content>
  </think>
compiler_expectation:
  expected_shape: "INVALID"
  expected_error_code: "E_AMBIGUOUS_PROTOCOL_SYNTAX"
