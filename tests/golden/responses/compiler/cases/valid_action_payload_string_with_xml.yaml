name: valid_action_payload_string_with_xml
input: |
  <think>This should not be an XML error.</think>
  <action>"this is a string with <type>"</action>
expected:
  shape: INVALID
  error_code: E_ACTION_PAYLOAD_NOT_OBJECT
  has_ir: false
notes: This case verifies that valid JSON strings are correctly identified as E_ACTION_PAYLOAD_NOT_OBJECT, and not misclassified as E_ACTION_PAYLOAD_XML_FIELDS.
expected_shadow_mismatches:
  - has_visible_answer
  - has_action
  - action_count
