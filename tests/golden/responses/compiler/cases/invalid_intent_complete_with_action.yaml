description: "A complete intent transition cannot be combined with an action."
input: |
  <intent mode="complete">{"intent_id":"x"}</intent>
  <action>{"type":"read_file","path":"x.py"}</action>
expected:
  shape: INVALID
  error_code: E_INTENT_COMPLETE_WITH_ACTION
  recovery_id: intent_complete_with_action_not_allowed
  has_ir: false
  action_count: 0
  has_visible_answer: false
  has_think: false
  has_checkpoint: false
expected_shadow_mismatches:
  - action_count
  - invalid_kind
  - has_visible_answer
