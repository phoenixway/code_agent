name: valid_action_payload_string_with_tool_code
input: |
  <think>This should not be a tool code error.</think>
  <action>"read_file(\"x.py\")"</action>
expected:
  shape: INVALID
  error_code: E_ACTION_PAYLOAD_NOT_OBJECT
  has_ir: false
notes: This case verifies that valid JSON strings are correctly identified as E_ACTION_PAYLOAD_NOT_OBJECT, and not misclassified as E_ACTION_PAYLOAD_TOOL_CODE.
expected_shadow_mismatches:
  - has_visible_answer
  - has_action
  - action_count
