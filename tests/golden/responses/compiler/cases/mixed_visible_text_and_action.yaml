name: mixed_visible_text_and_action
input: |
  I will inspect the file.
  <action>{"action":"read_file","args":{"path":"tui.py"}}</action>
expected:
  shape: PRE_ACTION_TEXT_AND_ACTION
  error_code: null
  has_ir: true
  has_visible_answer: false
